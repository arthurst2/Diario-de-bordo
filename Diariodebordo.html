<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Bordo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f4f4;
    color: #222;
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 20px;
  }

  h1 {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 12px;
    color: #666;
    margin-bottom: 16px;
  }

  .clock {
    font-size: 13px;
    color: #444;
    margin-bottom: 16px;
  }

  /* Botões */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }

  button {
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 3px;
    border: 1px solid #999;
    background: #fff;
    color: #222;
  }
  button:hover { background: #e8e8e8; }

  .btn-blue  { background: #1a56db; color: #fff; border-color: #1a56db; }
  .btn-blue:hover  { background: #1446b8; }
  .btn-green { background: #1d7a3a; color: #fff; border-color: #1d7a3a; }
  .btn-green:hover { background: #155c2b; }
  .btn-red   { background: #fff; color: #c0392b; border-color: #c0392b; }
  .btn-red:hover   { background: #fdecea; }

  .counter { margin-left: auto; font-size: 13px; color: #555; }

  /* Tabela */
  .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #ccc; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; min-width: 750px; }

  thead { background: #222; color: #fff; }
  th { padding: 10px 12px; text-align: left; font-size: 12px; font-weight: bold; white-space: nowrap; }
  th.center { text-align: center; }

  tbody tr { border-bottom: 1px solid #ddd; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: #f9f9f9; }
  tbody tr:hover { background: #eef4ff; }

  td { padding: 9px 12px; font-size: 13px; vertical-align: middle; }
  td.center { text-align: center; }
  td.muted { color: #999; }
  td.bold { font-weight: bold; }
  td.green { color: #1d7a3a; font-weight: bold; }
  td.orange { color: #b85c00; font-weight: bold; }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .tag-viagem  { background: #fff3cd; color: #7d5a00; border: 1px solid #e6c44a; }
  .tag-retorno { background: #d4edda; color: #155724; border: 1px solid #5cb85c; }

  .act-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    padding: 3px 6px;
    border-radius: 3px;
    color: #555;
  }
  .act-btn:hover { background: #eee; }

  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #fff;
    border: 1px solid #bbb;
    border-radius: 4px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 { font-size: 16px; margin-bottom: 16px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }

  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #444; }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #bbb;
    border-radius: 3px;
    font-size: 13px;
    font-family: Arial, sans-serif;
    background: #fff;
  }
  .field input:focus, .field select:focus { outline: 2px solid #1a56db; border-color: #1a56db; }
  .field input.auto { background: #f0f7ff; color: #1a56db; font-weight: bold; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .divider { border-top: 1px solid #ddd; margin: 16px 0 13px; font-size: 12px; color: #666; font-weight: bold; padding-top: 12px; }

  .modal-footer { display: flex; gap: 8px; margin-top: 18px; }
  .modal-footer button { flex: 1; padding: 9px; font-size: 13px; }
  .btn-del-sm { flex: 0 !important; color: #c0392b; border-color: #c0392b; }
  .btn-del-sm:hover { background: #fdecea; }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #222; color: #fff;
    padding: 10px 16px; border-radius: 3px;
    font-size: 13px; z-index: 999;
    transform: translateX(200%); transition: transform 0.25s;
  }
  .toast.show { transform: translateX(0); }

  @media print {
    .controls, .overlay, .toast, td.center:last-child, th.center:last-child { display: none !important; }
    body { background: #fff; padding: 0; }
    .table-wrap { border: none; }
  }
</style>
</head>
<body>

<h1>Diário de Bordo</h1>
<div class="subtitle">Controle de uso de veículos da empresa</div>
<div class="clock" id="clock"></div>

<div class="controls">
  <button class="btn-blue" onclick="openNew()">+ Nova Saída</button>
  <button class="btn-green" onclick="exportXLSX()">↓ Excel</button>
  <button onclick="exportCSV()">↓ CSV</button>
  <button onclick="window.print()">Imprimir</button>
  <button class="btn-red" onclick="clearAll()">Limpar Tudo</button>
  <span class="counter">Total: <strong id="totalCount">0</strong> registros</span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Data</th>
        <th>Saída</th>
        <th>Retorno</th>
        <th>Motorista</th>
        <th>Placa</th>
        <th>Origem / Destino</th>
        <th>Status</th>
        <th class="center">Ações</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="outsideClick(event)">
  <div class="modal">
    <h2 id="modalTitle">Nova Saída</h2>

    <div class="field-row">
      <div class="field">
        <label>Data (automático)</label>
        <input type="text" id="fData" class="auto" readonly>
      </div>
      <div class="field">
        <label>Hora Saída (automático)</label>
        <input type="text" id="fSaida" class="auto" readonly>
      </div>
    </div>

    <div class="field">
      <label>Motorista *</label>
      <input type="text" id="fMotorista" placeholder="Nome do motorista" autocomplete="off">
    </div>

    <div class="field">
      <label>Veículo *</label>
      <select id="fPlaca">
        <option value="">— Selecione —</option>
        <option value="ONJ1A38">ONJ1A38</option>
        <option value="SGN6F32">SGN6F32</option>
        <option value="SGN6F35">SGN6F35</option>
        <option value="OUTRO">Outro (digitar)</option>
      </select>
    </div>

    <div class="field" id="placaManualWrap" style="display:none">
      <label>Placa (manual)</label>
      <input type="text" id="fPlacaManual" placeholder="Ex: ABC-1234" maxlength="10" style="text-transform:uppercase">
    </div>

    <div class="field">
      <label>Origem / Destino</label>
      <input type="text" id="fDestino" placeholder="Ex: Escritório → Cliente X">
    </div>

    <div class="divider">Retorno (preencha quando o veículo voltar)</div>

    <div class="field">
      <label>Hora Retorno</label>
      <input type="text" id="fRetorno" placeholder="HH:MM — deixe vazio se ainda não retornou">
    </div>

    <div class="modal-footer">
      <button onclick="closeModal()">Cancelar</button>
      <button class="btn-del-sm" id="btnDel" onclick="deleteFromModal()" style="display:none">Excluir</button>
      <button class="btn-blue" onclick="saveEntry()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const VEICULOS = ['ONJ1A38','SGN6F32','SGN6F35'];
  let entries = JSON.parse(localStorage.getItem('diario_bordo') || '[]');
  let editIdx = -1;

  // Clock
  function tick() {
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    document.getElementById('clock').textContent =
      `${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}  —  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  setInterval(tick, 1000); tick();

  const pad = n => String(n).padStart(2,'0');
  const nowDate = () => { const d=new Date(); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
  const nowTime = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function save() { localStorage.setItem('diario_bordo', JSON.stringify(entries)); render(); }

  function render() {
    document.getElementById('totalCount').textContent = entries.length;
    const tb = document.getElementById('tbody');
    if (!entries.length) {
      tb.innerHTML = `<tr><td colspan="9" class="empty">Nenhum registro. Clique em "+ Nova Saída" para começar.</td></tr>`;
      return;
    }
    tb.innerHTML = entries.map((e,i) => {
      const ret = e.retorno && e.retorno.trim();
      const tag = ret
        ? `<span class="tag tag-retorno">Retornou</span>`
        : `<span class="tag tag-viagem">Em viagem</span>`;
      return `<tr>
        <td class="muted">${i+1}</td>
        <td class="bold">${esc(e.data)||'—'}</td>
        <td class="orange">${esc(e.saida)||'—'}</td>
        <td class="${ret?'green':'muted'}">${esc(e.retorno)||'—'}</td>
        <td>${esc(e.motorista)||'—'}</td>
        <td class="bold">${esc(e.placa)||'—'}</td>
        <td>${esc(e.destino)||'—'}</td>
        <td>${tag}</td>
        <td class="center">
          <button class="act-btn" onclick="openEdit(${i})" title="Editar">✏️</button>
          <button class="act-btn" onclick="delEntry(event,${i})" title="Excluir">🗑</button>
        </td>
      </tr>`;
    }).join('');
  }

  // Placa
  document.getElementById('fPlaca').addEventListener('change', function() {
    const show = this.value === 'OUTRO';
    document.getElementById('placaManualWrap').style.display = show ? 'block' : 'none';
    if (show) document.getElementById('fPlacaManual').focus();
    else document.getElementById('fPlacaManual').value = '';
  });
  function getPlaca() {
    const v = document.getElementById('fPlaca').value;
    return v === 'OUTRO' ? document.getElementById('fPlacaManual').value.trim().toUpperCase() : v;
  }
  function setPlaca(p) {
    const sel = document.getElementById('fPlaca');
    if (VEICULOS.includes(p)) { sel.value = p; document.getElementById('placaManualWrap').style.display='none'; }
    else if (p) { sel.value='OUTRO'; document.getElementById('placaManualWrap').style.display='block'; document.getElementById('fPlacaManual').value=p; }
    else { sel.value=''; document.getElementById('placaManualWrap').style.display='none'; }
  }

  // Modal
  function openNew() {
    editIdx = -1;
    document.getElementById('modalTitle').textContent = 'Nova Saída';
    document.getElementById('fData').value = nowDate();
    document.getElementById('fSaida').value = nowTime();
    document.getElementById('fMotorista').value = '';
    document.getElementById('fPlaca').value = '';
    document.getElementById('fPlacaManual').value = '';
    document.getElementById('placaManualWrap').style.display = 'none';
    document.getElementById('fDestino').value = '';
    document.getElementById('fRetorno').value = '';
    document.getElementById('btnDel').style.display = 'none';
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('fMotorista').focus(), 80);
  }
  function openEdit(i) {
    editIdx = i;
    const e = entries[i];
    document.getElementById('modalTitle').textContent = `Editar Registro #${i+1}`;
    document.getElementById('fData').value = e.data||'';
    document.getElementById('fSaida').value = e.saida||'';
    document.getElementById('fMotorista').value = e.motorista||'';
    setPlaca(e.placa||'');
    document.getElementById('fDestino').value = e.destino||'';
    document.getElementById('fRetorno').value = e.retorno||'';
    document.getElementById('btnDel').style.display = 'inline-block';
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('fMotorista').focus(), 80);
  }
  function closeModal() { document.getElementById('overlay').classList.remove('open'); editIdx=-1; }
  function outsideClick(e) { if (e.target===document.getElementById('overlay')) closeModal(); }

  function saveEntry() {
    const motorista = document.getElementById('fMotorista').value.trim();
    if (!motorista) { toast('Informe o nome do motorista!'); document.getElementById('fMotorista').focus(); return; }
    const placa = getPlaca();
    if (!placa) { toast('Selecione o veículo!'); document.getElementById('fPlaca').focus(); return; }
    const entry = {
      data: document.getElementById('fData').value,
      saida: document.getElementById('fSaida').value,
      retorno: document.getElementById('fRetorno').value.trim(),
      motorista, placa,
      destino: document.getElementById('fDestino').value.trim()
    };
    if (editIdx === -1) { entries.push(entry); toast('Saída registrada!'); }
    else { entries[editIdx] = entry; toast('Registro atualizado!'); }
    save(); closeModal();
  }

  function delEntry(ev, i) {
    ev && ev.stopPropagation();
    if (!confirm(`Excluir registro #${i+1} (${entries[i].motorista||'?'})?`)) return;
    entries.splice(i,1); save(); toast('Registro excluído.');
  }
  function deleteFromModal() { if (editIdx<0) return; const i=editIdx; closeModal(); delEntry(null,i); }
  function clearAll() {
    if (!entries.length) return;
    if (!confirm(`Apagar todos os ${entries.length} registros?`)) return;
    entries=[]; save(); toast('Todos os registros removidos.');
  }

  // Excel
  function exportXLSX() {
    if (!entries.length) { toast('Nenhum dado para exportar.'); return; }
    const header = ['#','Data','Hora Saída','Hora Retorno','Motorista','Placa','Origem/Destino','Status'];
    const rows = entries.map((e,i)=>[i+1,e.data||'',e.saida||'',e.retorno||'',e.motorista||'',e.placa||'',e.destino||'',(e.retorno&&e.retorno.trim())?'Retornou':'Em viagem']);
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([header,...rows]);
    ws['!cols']=[{wch:4},{wch:12},{wch:11},{wch:13},{wch:22},{wch:11},{wch:30},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, 'Diário de Bordo');
    XLSX.writeFile(wb, `diario_bordo_${nowDate().replace(/\//g,'-')}.xlsx`);
    toast('Excel exportado!');
  }

  // CSV
  function exportCSV() {
    if (!entries.length) { toast('Nenhum dado para exportar.'); return; }
    const header = ['#','Data','Hora Saída','Hora Retorno','Motorista','Placa','Origem/Destino','Status'];
    const rows = entries.map((e,i)=>[i+1,e.data||'',e.saida||'',e.retorno||'',e.motorista||'',e.placa||'',e.destino||'',(e.retorno&&e.retorno.trim())?'Retornou':'Em viagem']);
    const csv=[header,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`diario_bordo_${nowDate().replace(/\//g,'-')}.csv`;
    a.click();
    toast('CSV exportado!');
  }

  // Toast
  function toast(msg) {
    const el=document.getElementById('toast');
    el.textContent=msg; el.classList.add('show');
    clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500);
  }

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeModal();
    if(e.key==='Enter' && document.getElementById('overlay').classList.contains('open'))
      if(!['BUTTON','SELECT'].includes(e.target.tagName)) saveEntry();
  });

  render();
</script>
</body>
</html>
